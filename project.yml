name: MiniCal
options:
  bundleIdPrefix: com.minical
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
targets:
  MiniCal:
    type: application
    platform: macOS
    sources:
      - MiniCal
    info:
      path: MiniCal/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # Pinned here because `xcodegen generate` rewrites project.pbxproj and
        # would otherwise discard a team set through Xcode's UI.
        DEVELOPMENT_TEAM: TTHLPCMTR9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.minical.MiniCal
    dependencies:
      - sdk: ServiceManagement.framework
